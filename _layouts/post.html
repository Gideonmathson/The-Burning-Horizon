---
layout: default
---
{% assign a = site.data.authors[page.author] %}<article class="article"><div class="article-kicker">{{ page.category }} · {{ page.date | date: "%d %B %Y" }}</div><h1>{{ page.title }}</h1><p class="dek">{{ page.excerpt_text }}</p><div class="byline">By {{ a.name }} · {{ page.reading_time | default: "5 min read" }}</div>{{ content }}<div class="author-box"><div class="smallcaps">About the author</div><div><h3>{{ a.name }}</h3><p>{{ a.bio }}</p></div></div></article>
